name: Release

on:
  push:
    tags:
      - "v*"

env:
  APP: myapp
  PKG: ./cmd/myapp   # use "." if main.go is in the repo root

jobs:
  build:
    runs-on: ubuntu-latest
    container: golang:1.26-bookworm   # build happens inside this Docker image
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: apt-get update && apt-get install -y --no-install-recommends zip

      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"

          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/${APP} ${PKG}
          gzip -9 -c dist/${APP} > dist/${APP}-${VERSION}-linux-amd64.gz
          rm dist/${APP}

          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/${APP}.exe ${PKG}
          (cd dist && zip ${APP}-${VERSION}-windows-amd64.zip ${APP}.exe)
          rm dist/${APP}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Create source archive
        run: |
          git archive --format=tar.gz \
            --prefix=${APP}-${{ github.ref_name }}/ \
            -o dist/${APP}-${{ github.ref_name }}-src.tar.gz HEAD

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true